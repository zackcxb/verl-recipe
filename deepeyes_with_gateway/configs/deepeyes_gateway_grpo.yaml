# Minimal phase-1 config skeleton for the DeepEyes gateway recipe.
# Inherits all PPO trainer defaults; recipe only overrides what's different.
hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  custom_cls:
    path: recipe/deepeyes_with_gateway/dataset.py
    name: DeepEyesGatewayDataset

actor_rollout_ref:
  rollout:
    agent:
      agent_loop_manager_class: recipe.deepeyes_with_gateway.trainer_adapter.AgentFrameworkRolloutAdapter
    custom:
      agent_framework:
        gateway_count: 8
        max_turns: 5
        tool_config_path: recipe/deepeyes_with_gateway/configs/image_zoom_in_tool_config.yaml

custom_reward_function:
  path: recipe/deepeyes_with_gateway/reward.py
  name: compute_score
